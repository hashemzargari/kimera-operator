              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired environment.
            properties:
              configMapRef:
                description: ConfigMapRef, when set, is injected into the container
